<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-Restoration:Hawai'i</title>
      <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p> Aloha. this is the contact form. We would love to hear from you and see you get involved. Please fill out this contact form</p>
    
<h1>Contact Form</h1>
    <p>Come join us and get involved!</p>
<form>
    
     <fieldset>
         
        <legend>Contact Information</legend>

        <label for="___">Your Name:</label>
        <input type="text" id="___" name="name" ___ required>

        <br><br>

        <label for="___">Email Address:</label>
        <input type="email" id="email" name="email" ___>
          <p>
        <label for="phone">Phone </label>
        <input type="tel" placeholder="Enter your number" >
      </p>
      </fieldset>
    
     <br>
      <label for="event-type">Event Type:</label>
      <select id="event-type" name="event-type">
        <option value="">Choose event type</option>
        <option value="La Ho'i Ho'i Ea">La Ho'i Ho'i Ea</option>
        <option value="Onipa'a March">Onipa'a March</option>
        <option value="Restoration Clean up/Event">Resoration Clean up/Event</option>
        <option value="other">Other</option>
      </select>

    

      <br><br>
    <p>* if choosing other</p>
    
     <label for="details">IF choosing other:</label>
      <br>
      <textarea id="details" name="details" rows="5" cols="40"></textarea>
    
    <br><br>
    
    <fieldset> 
        <legend> What are you looking forward too?</legend>
        

  <input type="checkbox" id="coding" name="interests" value="coding">
  <label for="the food">The food</label>
<br><br>
  <input type="checkbox" id="design" name="interests" value="design">
  <label for="Learning something new">Learning something new</label>
<br><br>
  <input type="checkbox" id="writing" name="interests" value="writing">
  <label for="exploring places">Exploring places</label>
        <br><br>
 <input type="checkbox" id="other" name="other" value="other">
        <label for="other">Other</label>
  

    
    
    
    
    </fieldset>
    
    <button type="submit">Submit Form</button>
 
    
    </form>   
    
</body>
</html>
