<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-Restoration:Hawai'i</title>
      <link rel="stylesheet" href="styles.css">
</head>
<body>
    
     <header> 
    <nav>
        <ul>
            <li><a href="index.html">Homepage</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="resources.html">Resources</a></li>
            <li><a href="history.html">History</a></li>
           
        </ul> 
</nav> 
</header> 

<main> 
  <h1>Contact Form</h1> 
  <p>Come join us and get involved!</p> 
  
  <form> 
    <fieldset> 
      <legend>Contact Information</legend> 
      
   
      <label for="name">Name:</label> 
      <input type="text" id="name" name="name" required> 
      <br><br> 
      
      
      <label for="email">Email Address:</label> 
      <input type="email" id="email" name="email"> 
      
     
      <p> 
        <label for="phone">Phone</label> 
        <input type="tel" id="phone" name="phone" placeholder="Enter your number"> 
      </p> 
    </fieldset> 
    <br> 

    <label for="event-type">Event Type:</label> 
    <select id="event-type" name="event-type"> 
      <option value="">Choose event type</option> 
      <option value="La Ho'i Ho'i Ea">La Ho'i Ho'i Ea</option> 
      <option value="Onipa'a March">Onipa'a March</option> 
      <option value="Restoration Clean up/Event">Restoration Clean up/Event</option> 
      <option value="other">Other</option> 
    </select> 
    <br><br> 

    <label for="details">IF choosing other:</label> 
    <br> 
    <textarea id="details" name="details" rows="5" cols="40"></textarea> 
    <br><br> 

    <fieldset> 
      <legend>What are you looking forward to?</legend> 
      
     
      <input type="checkbox" id="the-food" name="interests" value="food"> 
      <label for="the-food">The food</label> 
      <br><br> 
      
     
      <input type="checkbox" id="learning-new" name="interests" value="learning"> 
      <label for="learning-new">Learning something new</label> 
      <br><br> 
      
      
      <input type="checkbox" id="exploring-places" name="interests" value="exploring"> 
      <label for="exploring-places">Exploring places</label> 
      <br><br> 
      
      
      <input type="checkbox" id="other-interest" name="interests" value="other"> 
      <label for="other-interest">Other</label> 
    </fieldset> 
    
    <br>
    <button type="submit">Submit Form</button> 
    
    <footer> 
      <p>&copy; 2026 Restoration Of Culture and Land: Hawai'i.</p> 
    </footer> 
  </form> 
</main> 
</body> 
</html>
